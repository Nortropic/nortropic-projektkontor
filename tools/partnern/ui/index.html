<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Förbättringspartner · Projektkontoret</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<div id="inloggning" class="inloggning" hidden>
  <form id="inloggningsformular" class="inloggningsruta">
    <h1><span class="gnista" aria-hidden="true"></span>Förbättringspartnern</h1>
    <p>Projektkontorets interna samtalsyta. Logga in med nyckeln från <code>tools/partner.py oppna</code>.</p>
    <label for="nyckel">Nyckel</label>
    <input id="nyckel" type="password" autocomplete="current-password" required>
    <button type="submit">Logga in</button>
    <p id="inloggningsfel" class="fel" role="alert"></p>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="sida" aria-label="Trådar">
    <div class="sida-huvud">
      <span class="namn">Förbättringspartnern</span>
    </div>
    <nav class="sidnav" aria-label="Meny">
      <button id="nytrad" class="navrad nytrad" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>Ny tråd</button>
      <form id="sokformular" class="navrad sok" role="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13 13l3.5 3.5"/></svg>
        <input id="sokfalt" type="search" placeholder="Sök i tidigare resonemang" aria-label="Sök i tidigare resonemang och underlag">
      </form>
      <button id="visaforstaelse" class="navrad" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3.5h8.5L15.5 6v10.5H5z"/><path d="M8 8.5h5M8 11.5h5"/></svg>Bestående förståelse</button>
      <button id="visaoverlamningar" class="navrad" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 10h11M11 6.5l3.5 3.5-3.5 3.5"/></svg>Överlämningar</button>
      <button id="visalage" class="navrad" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M10 6.5V10l2.5 1.5"/></svg>Tjänst och källor</button>
    </nav>
    <div class="sektion">Trådar</div>
    <nav id="tradlista" class="tradlista" aria-label="Trådar"></nav>
    <div class="sida-fot">
      <span class="avatar" aria-hidden="true">J</span>
      <span class="vem">Johnny <span class="dampad">· Projektkontoret</span></span>
    </div>
  </aside>

  <main id="huvud" class="huvud">
    <header class="tradhuvud">
      <h2 id="tradtitel" class="tradtitel" tabindex="0" title="Klicka för att byta namn">Ny tråd</h2>
      <div id="tradstatus" class="tradstatus" aria-live="polite"></div>
    </header>
    <section id="dar" class="dar" hidden aria-label="Där vi är"></section>
    <section id="flode" class="flode" aria-live="polite"></section>

    <form id="komponera" class="komponera">
      <div id="utkorg" class="utkorg" aria-live="polite"></div>
      <div class="ruta">
        <div id="modellval" class="modellval" hidden tabindex="0" role="dialog" aria-label="Välj modell och ansträngning"></div>
        <div id="bilagelista" class="bilagelista"></div>
        <textarea id="text" rows="2" placeholder="Vad tänker du på? Skriv, klistra in en bild eller släpp filer här…" aria-label="Meddelande"></textarea>
        <div class="kontroller">
          <label class="plus" title="Bifoga filer"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg><span class="dold">Bifoga</span><input id="filval" type="file" multiple hidden></label>
          <div class="lagesval" role="group" aria-label="Läge">
            <button id="lage-svara" type="button" class="vald" aria-pressed="true">Svara</button>
            <button id="lage-spara" type="button" aria-pressed="false">Bara spara</button>
          </div>
          <input id="baraspara" type="checkbox" hidden>
          <span class="fyll"></span>
          <button id="modellrad" type="button" class="modellrad" title="Byt modell och ansträngning (/model)" aria-haspopup="dialog"></button>
          <button id="skickaavbryt" type="button" class="sekundar" hidden>Avbryt och skicka</button>
          <button id="skicka" type="submit" class="skicka" aria-label="Skicka" title="Skicka (Enter)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4M5 9l5-5 5 5"/></svg></button>
        </div>
      </div>
      <div id="utkaststatus" class="utkaststatus" aria-live="polite"></div>
      <div id="forslag" class="forslag" hidden></div>
    </form>
  </main>

  <aside id="panel" class="panel" hidden aria-label="Panel">
    <div class="panel-huvud"><h3 id="paneltitel">Källa</h3><button id="stangpanel" class="lank" aria-label="Stäng panelen">Stäng</button></div>
    <div id="panelinnehall" class="panel-innehall"></div>
  </aside>
</div>
<div id="slapp" class="slapp" hidden>Släpp filerna för att bifoga dem</div>
</body>
</html>
